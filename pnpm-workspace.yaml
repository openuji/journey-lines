packages:
  - 'packages/*'
  - 'packages/client/*'
  - 'apps/*'
  # The website is its own npm project (and its own repo), not a workspace member.
  - '!apps/web'

# esbuild's postinstall fetches its platform-native binary; the client tier
# bundles through it. Puppeteer's downloads the Chrome for Testing build it is
# pinned to.
allowBuilds:
  esbuild: true
  puppeteer: true
  workerd: true
